<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="28%" cy="16%" r="115%">
      <stop offset="0" stop-color="#164650"/>
      <stop offset=".42" stop-color="#0a2731"/>
      <stop offset="1" stop-color="#040b11"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2f6ea"/>
      <stop offset=".55" stop-color="#5fd3bd"/>
      <stop offset="1" stop-color="#1b8d7e"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset=".55" stop-color="#e6dac0"/>
      <stop offset="1" stop-color="#b3a384"/>
    </linearGradient>
    <radialGradient id="disc" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#f1e9d8"/>
      <stop offset="1" stop-color="#c4b38f"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- two opposing points: teal hanging from the top, ivory rising from the bottom -->
  <path d="M14 8h48L38 114z" fill="url(#teal)"/>
  <path d="M66 120h48L90 14z" fill="url(#ivory)"/>
  <!-- a glossy checker seated at the foot of the ivory point -->
  <circle cx="86" cy="96" r="20" fill="#04101a" opacity=".5"/>
  <circle cx="86" cy="92" r="20" fill="url(#disc)"/>
  <circle cx="86" cy="92" r="20" fill="none" stroke="#5fd3bd" stroke-width="3"/>
  <circle cx="86" cy="92" r="11" fill="none" stroke="#04101a" stroke-opacity=".14" stroke-width="2"/>
  <rect width="128" height="128" rx="28" fill="url(#sheen)"/>
</svg>
