<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later. Standalone recovery: no cached app imports. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#11191d" />
    <meta name="robots" content="noindex" />
    <title>Refresh Backgammon</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          16px/1.6 system-ui,
          sans-serif;
        background: #11191d;
        color: #eeeade;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: max(28px, env(safe-area-inset-top))
          max(22px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom))
          max(22px, env(safe-area-inset-left));
      }
      main {
        max-width: 490px;
        margin: min(12vh, 100px) auto 0;
      }
      a {
        color: #9bd6c9;
        text-underline-offset: 4px;
      }
      .brand {
        font-weight: 600;
        text-decoration: none;
      }
      h1 {
        font-size: clamp(27px, 6vw, 34px);
        line-height: 1.2;
        letter-spacing: -0.6px;
        margin: 32px 0 18px;
      }
      p {
        margin: 0 0 18px;
      }
      .muted {
        color: #b0c0c1;
      }
      button {
        font: inherit;
        font-weight: 650;
        color: #112a26;
        background: #9bd6c9;
        border: 0;
        border-radius: 8px;
        min-height: 48px;
        padding: 11px 20px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #d3f1ac;
        outline-offset: 4px;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 22px;
        flex-wrap: wrap;
        margin-top: 26px;
      }
      #status {
        margin: 22px 0 0;
        min-height: 26px;
      }
      #status[data-error="true"] {
        color: #ffb4a8;
      }
      #continue {
        display: inline-block;
        padding-block: 12px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/backgammon/">Backgammon</a>
      <h1>Refresh the app.</h1>
      <p>
        Download a fresh copy of Backgammon. Your saved games, Library, training
        progress and settings stay on this device.
      </p>
      <p class="muted">
        Keep this page open and close your other Backgammon tabs first. Finish
        any online game before refreshing.
      </p>
      <div class="actions">
        <button id="refresh" type="button">Refresh Backgammon</button>
        <a href="/backgammon/play/">Back to Play</a>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <a id="continue" href="/backgammon/play/" hidden
        >Open the updated app →</a
      >
      <noscript
        ><p>Turn on JavaScript in Safari to refresh the app.</p></noscript
      >
    </main>
    <script>
      // Intentionally self-contained: an old app worker cannot serve stale
      // imports here. No saved user data APIs are accessed by this page.
      const button = document.getElementById("refresh");
      const status = document.getElementById("status");
      const link = document.getElementById("continue");
      function untilWorker(worker, wanted) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(
            () =>
              finish(
                new Error(
                  "The download is taking too long. Check your connection and try again.",
                ),
              ),
            45000,
          );
          const check = () => {
            if (wanted.includes(worker.state)) finish();
            else if (worker.state === "redundant")
              finish(
                new Error("The download did not finish. Please try again."),
              );
          };
          function finish(error) {
            clearTimeout(timer);
            worker.removeEventListener("statechange", check);
            error ? reject(error) : resolve();
          }
          worker.addEventListener("statechange", check);
          check();
        });
      }
      function refresh(worker) {
        return new Promise((resolve, reject) => {
          const channel = new MessageChannel();
          const timer = setTimeout(
            () =>
              finish(
                null,
                new Error(
                  "The app did not respond. Check your connection and try again.",
                ),
              ),
            45000,
          );
          function finish(result, error) {
            clearTimeout(timer);
            channel.port1.close();
            channel.port2.close();
            error ? reject(error) : resolve(result);
          }
          channel.port1.onmessage = (event) => finish(event.data);
          worker.postMessage({ type: "BACKGAMMON_REFRESH" }, [channel.port2]);
        });
      }
      button.addEventListener("click", async () => {
        button.disabled = true;
        link.hidden = true;
        status.dataset.error = "false";
        status.textContent = "Checking for a fresh copy…";
        try {
          if (!("serviceWorker" in navigator))
            throw new Error(
              "This browser cannot refresh the offline app. Use a current version of Safari.",
            );
          const registration = await navigator.serviceWorker.register(
            "/backgammon/sw.js",
            {
              scope: "/backgammon/",
              updateViaCache: "none",
            },
          );
          await registration.update();
          const worker =
            registration.installing ||
            registration.waiting ||
            registration.active;
          if (!worker)
            throw new Error(
              "The update is not ready. Check your connection and try again.",
            );
          status.textContent = "Downloading current app files…";
          await untilWorker(worker, ["installed", "activated"]);
          const result = await refresh(worker);
          if (result.status !== "ready")
            throw new Error(
              result.message || "Refresh could not finish. Please try again.",
            );
          await untilWorker(worker, ["activated"]);
          status.textContent = "Updated. Your saved data is unchanged.";
          button.textContent = "Refresh again";
          link.href =
            "/backgammon/play/?updated=" + encodeURIComponent(result.version);
          link.hidden = false;
          link.focus();
        } catch (error) {
          status.dataset.error = "true";
          status.textContent =
            error.message || "Refresh failed. Please try again.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
