<section class="theme" id="theme-dune" data-theme="dune">
  <style>
    #theme-dune {
      --page: #efe4cf;
      --shader-1: #efe4cf;
      --shader-2: #e2d2b4;
      --shader-3: #d9c6a4;
      --surface: #f8f1e3;
      --surface-2: #e8dcc4;
      --line: #d6c5a6;
      --ink: #3a2a1c;
      --muted: #6f5a44;
      --accent: #b4461f;
      --accent-ink: #fff6ea;
      --danger: #8f2a1a;
      --board-frame: #a2683f;
      --board-surface: #eadbb8;
      --point-a: #b86a3e;
      --point-b: #c2a06a;
      --bar: #8a5a36;
      --checker-white: #fffaf0;
      --checker-white-edge: #c9b89b;
      --checker-black: #2b1d12;
      --checker-black-edge: #6b4a2f;
      --dice: #fffaf0;
      --pips: #2b1d12;
      --cube: #2b1d12;
      --cube-text: #fffaf0;
      --highlight: #0d4f5c;
      --last-move: #1f3a6e;
      --shadow: 3px 3px 0 rgba(58, 42, 28, .12);
      --radius: 6px;
      font-family: "Avenir Next", Futura, "Century Gothic", "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-variant-numeric: tabular-nums lining-nums;
      line-height: 1.5;
      color: var(--ink);
      background: var(--page);
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border-radius: var(--radius);
      padding: 28px;
      box-sizing: border-box;
      max-width: 1120px;
      margin: 0 auto;
    }
    #theme-dune *, #theme-dune *::before, #theme-dune *::after { box-sizing: inherit; }
    #theme-dune .shader {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; z-index: 0; pointer-events: none;
    }
    #theme-dune .layout {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: minmax(0, 600px) minmax(260px, 1fr);
      gap: 28px; align-items: start;
    }
    #theme-dune .board { width: 100%; height: auto; display: block; }
    #theme-dune h2 {
      margin: 0 0 8px; font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: 0;
    }
    #theme-dune p { margin: 0 0 20px; font-size: 16px; color: var(--muted); }
    #theme-dune .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    #theme-dune .btn {
      font: inherit; font-weight: 700; font-size: 15px; min-height: 44px; padding: 0 18px;
      border-radius: var(--radius); cursor: pointer; border: 1px solid transparent;
      display: inline-flex; align-items: center; justify-content: center;
    }
    #theme-dune .btn-primary {
      background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
      box-shadow: var(--shadow);
    }
    #theme-dune .btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
    #theme-dune .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px;
    }
    #theme-dune .panel dl { margin: 0; }
    #theme-dune .panel dt { font-size: 13px; color: var(--muted); font-weight: 500; }
    #theme-dune .panel dd { margin: 0; font-size: 22px; font-weight: 700; }
    #theme-dune .equity { grid-column: 1 / -1; display: flex; height: 10px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
    #theme-dune .equity i { display: block; height: 100%; }
    #theme-dune .equity .w { flex: 0 0 58%; background: var(--checker-white); border-right: 1px solid var(--ink); }
    #theme-dune .equity .b { flex: 1; background: var(--accent); }
    #theme-dune .swatches {
      position: relative; z-index: 1; margin-top: 28px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px;
    }
    #theme-dune .swatches figure { margin: 0; }
    #theme-dune .swatches i {
      display: block; height: 40px; border-radius: var(--radius);
      border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    #theme-dune .swatches figcaption {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); margin-top: 6px;
    }
    @media (max-width: 760px) {
      #theme-dune { padding: 16px; }
      #theme-dune .layout { grid-template-columns: 1fr; }
    }
  </style>

  <canvas class="shader" width="640" height="360" aria-hidden="true" data-pointer-origin="bottom-left" data-pointer-idle="none" data-still="3.5"></canvas>
  <script type="x-shader/x-fragment" id="frag-dune">
precision mediump float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_pointer;
uniform vec3 u_c1; // page sand      #efe4cf
uniform vec3 u_c2; // lit face       #e2d2b4
uniform vec3 u_c3; // shadow face    #d9c6a4

// --- helpers -------------------------------------------------------------
float hash21(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 19.19);
  return fract(p.x * p.y);
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 4; i++) {
    v += a * vnoise(p);
    p = m * p;
    a *= 0.5;
  }
  return v;
}
mat2 rot(float a) {
  float c = cos(a), s = sin(a);
  return mat2(c, -s, s, c);
}

// --- dune height field ---------------------------------------------------
// Ridged noise, domain sheared so the crests run diagonally. A very slow
// drift in u_time makes the ridges creep like wind-moved sand.
float ridges(vec2 p) {
  float n = fbm(p * 1.6 + vec2(u_time * 0.01, 0.0));
  return 1.0 - abs(2.0 * n - 1.0);
}
float height(vec2 uv) {
  return ridges(rot(0.6) * uv);
}

void main() {
  vec2 res = u_resolution;
  vec2 uv = gl_FragCoord.xy / res;
  float aspect = res.x / res.y;
  vec2 p = uv * vec2(aspect, 1.0);

  // Finite-difference normal from the height field.
  float e = 0.006;
  float h  = height(p);
  float hx = height(p + vec2(e, 0.0));
  float hy = height(p + vec2(0.0, e));
  float slope = 0.045;
  vec3 n = normalize(vec3((h - hx) / e * slope, (h - hy) / e * slope, 1.0));

  // One low sun from the left.
  vec3 sun = normalize(vec3(-0.7, 0.25, 0.65));
  float lit = clamp(dot(n, sun), 0.0, 1.0);
  float flat_ = clamp(sun.z, 0.0, 1.0);
  float shade = (lit - flat_) / flat_;     // 0 on flat ground, -1 in full shadow

  // Relief: page sand, warmed toward lit on the sun side and dropped toward
  // the shadow colour on the lee side. Small amplitude keeps ink legible.
  vec3 col = u_c1;
  col = mix(col, u_c2, clamp( shade, 0.0, 1.0) * 0.55);
  col = mix(col, u_c3, clamp(-shade, 0.0, 1.0) * 0.75);
  // Crests are slightly paler than troughs.
  col = mix(col, u_c1, h * 0.35);

  // Blown sand: fine grain drifting along the ridge direction.
  vec2 dir = rot(0.6) * vec2(1.0, 0.0);
  vec2 gp = gl_FragCoord.xy * 0.9 - dir * u_time * 0.4 * 24.0;
  float grain = hash21(floor(gp)) - 0.5;
  col += grain * 0.015 * 2.0;

  // Pointer halo: a soft 250px warm patch, lifted toward #f6ead3.
  float d = length(gl_FragCoord.xy - u_pointer);
  float halo = 1.0 - smoothstep(0.0, 250.0, d);
  col = mix(col, vec3(0.965, 0.918, 0.827), halo * halo * 0.22);

  gl_FragColor = vec4(col, 1.0);
}
  </script>
