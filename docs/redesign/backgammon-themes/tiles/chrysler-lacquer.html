  font-variant-numeric: lining-nums tabular-nums;
  color: var(--ink);
  background: var(--page);
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
  padding: 24px;
  border-radius: 2px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--surface-2);
  min-height: 360px;
}
#theme-chrysler-lacquer *, #theme-chrysler-lacquer *::before, #theme-chrysler-lacquer *::after { box-sizing: border-box; }
#theme-chrysler-lacquer .shader {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--page);
  z-index: 0;
}
#theme-chrysler-lacquer .tile-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(240px, 2fr);
  gap: 24px;
  align-items: start;
}
@media (max-width: 720px) {
  #theme-chrysler-lacquer .tile-grid { grid-template-columns: minmax(0, 1fr); }
}
#theme-chrysler-lacquer .board {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 2px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .55);
}
#theme-chrysler-lacquer .board text {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: .04em;
}
#theme-chrysler-lacquer .chrome { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
#theme-chrysler-lacquer h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 28px;
  line-height: 1.1;
  letter-spacing: .08em;
  color: var(--ink);
}
#theme-chrysler-lacquer p {
  margin: 0;
  font-size: 15px;
  line-height: 1.5;
  color: var(--muted);
  max-width: 36ch;
}
#theme-chrysler-lacquer .actions { display: flex; flex-wrap: wrap; gap: 10px; }
#theme-chrysler-lacquer .btn {
  font: inherit;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: .08em;
  text-transform: uppercase;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--ink);
}
#theme-chrysler-lacquer .btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  box-shadow: inset 0 1px 0 var(--highlight);
}
#theme-chrysler-lacquer .btn-primary:hover { background: var(--highlight); }
#theme-chrysler-lacquer .btn-ghost:hover { background: rgba(214, 178, 94, .12); }
#theme-chrysler-lacquer .panel {
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--surface-2);
  border-radius: 2px;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
}
#theme-chrysler-lacquer .panel .label {
  display: block;
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
#theme-chrysler-lacquer .panel .value {
  display: block;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  line-height: 1.1;
  color: var(--ink);
}
#theme-chrysler-lacquer .swatches {
  position: relative;
  z-index: 1;
  margin-top: 24px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 8px;
}
#theme-chrysler-lacquer .swatch {
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--surface-2);
  border-radius: 2px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#theme-chrysler-lacquer .swatch i {
  display: block;
  height: 28px;
  border-radius: 2px;
  background: var(--sw);
  border: 1px solid rgba(214, 178, 94, .35);
}
#theme-chrysler-lacquer .swatch span {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  color: var(--ink);
  letter-spacing: .02em;
}
#theme-chrysler-lacquer .swatch small {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .04em;
  text-transform: uppercase;
}
</style>

<canvas class="shader" width="640" height="360" aria-hidden="true" data-pointer-origin="top-left" data-pointer-idle="center" data-still="0"></canvas>
<script type="x-shader/x-fragment" id="frag-chrysler-lacquer">
precision mediump float;

uniform float u_time;        // seconds
uniform vec2  u_resolution;  // px
uniform vec2  u_pointer;     // CSS px, origin top-left
uniform vec3  u_c1;          // page      #0C0D12
uniform vec3  u_c2;          // accent    #D6B25E brass
uniform vec3  u_c3;          // highlight #F0D27A

const float PI = 3.14159265;
const float FLUTES = 28.0;

float hash(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 19.19);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution;
  float aspect = u_resolution.x / u_resolution.y;

  // Fluted lacquer: 28 half-round ridges across the width.
  float fx = fract(uv.x * FLUTES) - 0.5;            // -0.5 .. 0.5 across one flute
  float ridge = cos(fx * PI);                        // 1 on the crest, 0 in the seam
  vec3 n = normalize(vec3(sin(fx * PI) * 1.4, 0.0, 1.0));

  // Raking light, one revolution per 90 s. At t = 0 it sits 35 deg from the top-left,
  // which is also where reduced-motion leaves it.
  float a = radians(125.0) + u_time * (2.0 * PI / 90.0);
  vec3 L = normalize(vec3(cos(a), sin(a), 0.75));
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 H = normalize(L + V);

  float diff = max(dot(n, L), 0.0);
  float spec = pow(max(dot(n, H), 0.0), 48.0);

  // Lacquer body: near-black, a hair lighter toward the top, darker in the seams.
  vec3 col = u_c1 * (0.80 + 0.30 * uv.y) * (0.82 + 0.18 * ridge);

  // Brushing along the flutes.
  float grain = noise(vec2(uv.x * FLUTES * 3.0, uv.y * 220.0)) - 0.5;
  col += grain * 0.025;

  // Brass specular on each crest, 18% at most, plus a whisper of diffuse.
  col += u_c2 * (spec * 0.18 + diff * 0.05);

  // Sunburst: 12 wedges radiating from the top centre at 4%.
  vec2 p = vec2((uv.x - 0.5) * aspect, uv.y - 1.08);
  float ang = atan(p.x, -p.y);                       // 0 straight down, +/- PI/2 at the sides
  float w = abs(fract(ang * 12.0 / PI) - 0.5) * 2.0;
  float wedge = 1.0 - smoothstep(0.35, 0.65, w);
  float reach = 1.0 - smoothstep(0.1, 1.3, length(p));
  col += u_c3 * wedge * reach * 0.04;

  // Pointer: a faint warm spot.
  vec2 ptr = vec2(u_pointer.x, u_resolution.y - u_pointer.y) / u_resolution;
  vec2 m = (ptr - uv) * vec2(aspect, 1.0);
  float d = length(m);
  col += u_c3 * exp(-d * d * 8.0) * 0.06;

  // Vignette.
  vec2 q = uv - 0.5;
  col *= 1.0 - dot(q, q) * 0.55;

  gl_FragColor = vec4(col, 1.0);
}
</script>
