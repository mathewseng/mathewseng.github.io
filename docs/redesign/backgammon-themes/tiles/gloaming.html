<section class="theme" id="theme-gloaming" data-theme="gloaming">
<style>
#theme-gloaming {
  --page: #120f1e;
  --shader-1: #ff9a5c;
  --shader-2: #655596;
  --shader-3: #120f1e;
  --surface: #1c1730;
  --surface-2: #251f3d;
  --line: #3a3156;
  --ink: #f6eee6;
  --muted: #b7a9b8;
  --accent: #ff9a5c;
  --accent-ink: #2a1206;
  --danger: #ff6b7a;
  --board-frame: #2a2140;
  --board-surface: #1a1528;
  --point-a: #e0683f;
  --point-b: #655596;
  --bar: #0f0c1a;
  --checker-white: #fbe9d3;
  --checker-white-edge: #c9a37a;
  --checker-black: #1b1026;
  --checker-black-edge: #a898d6;
  --dice: #fff2e2;
  --pips: #2a1206;
  --cube: #ffb27a;
  --cube-text: #2a1206;
  --highlight: #7df5e2;
  --last-move: #ffd166;
  --shadow-tint: #0a0616;
  font-family: -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  font-weight: 400;
  font-variant-numeric: lining-nums proportional-nums;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  box-sizing: border-box;
  max-width: 640px;
  padding: 20px;
  border-radius: 14px;
  background: var(--page);
  color: var(--ink);
  line-height: 1.4;
}
#theme-gloaming * { box-sizing: border-box; }
#theme-gloaming .shader {
  position: absolute;
  inset: 0;
  z-index: -1;
  display: block;
  width: 100%;
  height: 100%;
  background: linear-gradient(to top, var(--accent) 0%, var(--point-b) 50%, var(--page) 100%);
}
#theme-gloaming .board {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 0 16px;
  border-radius: 14px;
  box-shadow: 0 24px 24px -16px var(--shadow-tint);
}
#theme-gloaming .chrome {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: start;
  margin-bottom: 16px;
}
#theme-gloaming h2 {
  margin: 0 0 6px;
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0;
}
#theme-gloaming p {
  margin: 0 0 14px;
  color: var(--muted);
  font-size: 15px;
  max-width: 34ch;
}
#theme-gloaming .actions { display: flex; gap: 10px; flex-wrap: wrap; }
#theme-gloaming button {
  min-height: 44px;
  min-width: 44px;
  padding: 0 18px;
  border-radius: 10px;
  border: 1px solid transparent;
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.01em;
  cursor: pointer;
}
#theme-gloaming .btn-primary { background: var(--accent); color: var(--accent-ink); }
#theme-gloaming .btn-ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
#theme-gloaming .btn-danger { background: var(--danger); color: var(--accent-ink); }
#theme-gloaming .panel {
  min-width: 190px;
  align-self: stretch;
  padding: 14px 16px;
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 0 0 1px rgba(246, 238, 230, 0.18), 0 24px 24px -12px var(--shadow-tint);
}
#theme-gloaming .intro { padding: 16px 18px; }
#theme-gloaming .kv { display: flex; justify-content: space-between; gap: 16px; padding: 4px 0; }
#theme-gloaming .kv + .kv { border-top: 1px solid var(--line); }
#theme-gloaming .kv span { color: var(--muted); font-size: 13px; letter-spacing: 0.01em; }
#theme-gloaming .kv strong { font-weight: 500; font-size: 15px; }
#theme-gloaming .equity { position: relative; height: 4px; margin-top: 12px; border-radius: 2px; background: var(--line); }
#theme-gloaming .equity i { position: absolute; left: 0; top: 0; bottom: 0; width: 58%; border-radius: 2px; background: var(--last-move); }
#theme-gloaming .swatches {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  padding: 12px;
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 0 0 1px rgba(246, 238, 230, 0.18), 0 24px 24px -12px var(--shadow-tint);
}
#theme-gloaming .swatches figure { margin: 0; }
#theme-gloaming .swatches i { display: block; height: 36px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(246, 238, 230, 0.12); }
#theme-gloaming .swatches figcaption { margin-top: 4px; font-size: 12px; color: var(--muted); letter-spacing: 0.01em; }
@media (max-width: 520px) {
  #theme-gloaming .chrome { grid-template-columns: 1fr; }
  #theme-gloaming .swatches { grid-template-columns: repeat(4, 1fr); }
}
</style>

<canvas class="shader" width="640" height="360" aria-hidden="true" data-pointer-origin="bottom-left" data-pointer-idle="center" data-still="0"></canvas>
<script type="x-shader/x-fragment" id="frag-gloaming">
precision mediump float;
uniform float u_time;
uniform vec2  u_resolution;
uniform vec2  u_pointer;
uniform vec3  u_c1; // accent apricot  #ff9a5c
uniform vec3  u_c2; // dusk violet     #655596
uniform vec3  u_c3; // page            #120f1e

float hash21(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 19.19);
  return fract(p.x * p.y);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float amp = 0.5;
  for (int i = 0; i < 3; i++) {
    v += amp * vnoise(p);
    p = p * 2.02 + vec2(1.7, 9.2);
    amp *= 0.5;
  }
  return v;
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution.xy;
  float aspect = u_resolution.x / u_resolution.y;
  float t = u_time;
  vec2 ptr = u_pointer / u_resolution.xy - 0.5;

  // Sky: apricot horizon -> violet at mid -> page colour at the top.
  vec3 col = mix(u_c1, u_c2, smoothstep(0.0, 0.5, uv.y));
  col = mix(col, u_c3, smoothstep(0.5, 1.0, uv.y));

  // Two domain-warped fbm layers as thin cirrus bands, mixed at 12%.
  vec2 p = vec2(uv.x * aspect, uv.y) * 3.0 + vec2(t * 0.01, 0.0);
  vec2 warp = vec2(sin(p.y * 2.0 + t * 0.05), cos(p.x * 2.0 + t * 0.05)) * 0.35;
  float layerA = fbm(p + warp);
  float layerB = fbm(p * vec2(2.4, 0.9) - warp * 0.6 + vec2(3.1, 1.4));
  float bands = smoothstep(0.42, 0.72, layerA * 0.55 + layerB * 0.45);
  bands *= smoothstep(0.02, 0.2, uv.y) * (1.0 - smoothstep(0.4, 0.75, uv.y));
  col += bands * 0.12 * vec3(1.0, 0.86, 0.72);

  // Soft sun low at bottom-left; breathes and drifts 2% with the pointer.
  vec2 sunPos = vec2(0.2, 0.08) + ptr * 0.02;
  float breathe = 1.0 + sin(t * 0.3) * 0.02;
  vec2 d = vec2((uv.x - sunPos.x) * aspect, uv.y - sunPos.y);
  float sun = 1.0 - smoothstep(0.0, 0.35 * breathe, length(d));
  sun *= sun;
  col += sun * 0.25 * vec3(1.0, 0.82, 0.62);

  // First stars: sparse hash grid in the top 15% only.
  vec2 cell = floor(vec2(uv.x * aspect, uv.y) * 90.0);
  vec2 cf = fract(vec2(uv.x * aspect, uv.y) * 90.0);
  float h = hash21(cell);
  float star = step(0.995, h);
  vec2 sp = vec2(hash21(cell + 7.3), hash21(cell + 2.1));
  float sd = length(cf - sp);
  float twinkle = 0.75 + 0.25 * sin(t * 2.0 + h * 6.2831);
  float glow = (1.0 - smoothstep(0.0, 0.12, sd)) * star * twinkle;
  glow *= smoothstep(0.85, 0.92, uv.y);
  col += glow * 0.2;

  // Keep the upper field quiet under the UI.
  float darken = smoothstep(0.55, 0.78, uv.y);
  col *= 1.0 - darken * 0.35;

  gl_FragColor = vec4(col, 1.0);
}
</script>
