<section class="theme" id="theme-dessau-primary" data-theme="dessau-primary">
<style>
#theme-dessau-primary {
  --page: #EFEBE1;
  --shader-1: #D32F2F;
  --shader-2: #1E4FA3;
  --shader-3: #F2C230;
  --surface: #F7F4EC;
  --surface-2: #E3DED1;
  --line: #161616;
  --ink: #161616;
  --muted: #5A5751;
  --accent: #D32F2F;
  --accent-ink: #FFFFFF;
  --board-frame: #161616;
  --board-surface: #F7F4EC;
  --point-a: #1E4FA3;
  --point-b: #F2C230;
  --bar: #161616;
  --checker-white: #FFFFFF;
  --checker-white-edge: #161616;
  --checker-black: #161616;
  --checker-black-edge: #FFFFFF;
  --dice: #FFFFFF;
  --pips: #161616;
  --cube: #D32F2F;
  --cube-text: #FFFFFF;
  --highlight: #161616;
  --last-move: #D32F2F;
  font-family: "Futura", "Avenir Next", "Jost", "Century Gothic", system-ui, sans-serif;
  font-weight: 500;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--page);
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
  width: 100%;
  max-width: 960px;
  padding: 24px;
  border: 2px solid var(--line);
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  grid-template-areas: "board chrome" "swatches swatches";
  gap: 24px;
  border-radius: 0;
}
#theme-dessau-primary *, #theme-dessau-primary *::before, #theme-dessau-primary *::after { box-sizing: border-box; border-radius: 0; }
#theme-dessau-primary .shader {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%; display: block; pointer-events: none;
}
#theme-dessau-primary > :not(.shader):not(style):not(script) { position: relative; z-index: 1; }
#theme-dessau-primary .board { grid-area: board; width: 100%; height: auto; display: block; }
#theme-dessau-primary .chrome { grid-area: chrome; display: flex; flex-direction: column; gap: 16px; align-self: start; }
#theme-dessau-primary h2 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; }
#theme-dessau-primary p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink); }
#theme-dessau-primary .actions { display: flex; gap: 12px; }
#theme-dessau-primary .btn {
  font: inherit; font-weight: 700; font-size: 15px; letter-spacing: inherit;
  min-height: 44px; min-width: 96px; padding: 0 20px; cursor: pointer;
  border: 2px solid var(--line); background: transparent; color: var(--ink);
}
#theme-dessau-primary .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#theme-dessau-primary .panel {
  background: var(--surface); border: 2px solid var(--line);
  display: grid; grid-template-columns: 1fr 1fr;
}
#theme-dessau-primary .panel .cell { padding: 12px 14px; }
#theme-dessau-primary .panel .cell + .cell { border-left: 2px solid var(--line); }
#theme-dessau-primary .panel .label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
#theme-dessau-primary .panel .value { display: block; font-size: 24px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
#theme-dessau-primary .board text { font-family: inherit; font-weight: 700; }
#theme-dessau-primary .swatches {
  grid-area: swatches; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0;
  border: 2px solid var(--line); background: var(--surface);
}
#theme-dessau-primary .swatches > div { padding: 8px 6px 8px; }
#theme-dessau-primary .swatches > div + div { border-left: 2px solid var(--line); }
#theme-dessau-primary .swatches i { display: block; height: 36px; border: 1.5px solid var(--line); }
#theme-dessau-primary .swatches small {
  display: block; margin-top: 6px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px; color: var(--ink); letter-spacing: 0; white-space: nowrap; overflow: hidden;
}
@media (max-width: 720px) {
  #theme-dessau-primary { grid-template-columns: minmax(0, 1fr); grid-template-areas: "board" "chrome" "swatches"; padding: 16px; }
  #theme-dessau-primary .swatches { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #theme-dessau-primary .swatches > div + div { border-left: 0; }
  #theme-dessau-primary .swatches > div { border-top: 2px solid var(--line); border-right: 2px solid var(--line); }
  #theme-dessau-primary .swatches > div:nth-child(-n+4) { border-top: 0; }
  #theme-dessau-primary .swatches > div:nth-child(4n) { border-right: 0; }
}
</style>

<canvas class="shader" width="640" height="360" aria-hidden="true" data-pointer-origin="top-left" data-pointer-idle="center" data-still="17"></canvas>
<script type="x-shader/x-fragment" id="frag-dessau-primary">
precision mediump float;

uniform float u_time;
uniform vec2  u_resolution;
uniform vec2  u_pointer;
uniform vec3  u_c1; // red
uniform vec3  u_c2; // blue
uniform vec3  u_c3; // yellow

const float TAU = 6.28318530718;
const vec3  PAGE = vec3(0.937, 0.922, 0.882); // #EFEBE1

float sdCircle(vec2 p, float r) {
  return length(p) - r;
}

float sdBox(vec2 p, vec2 b) {
  vec2 d = abs(p) - b;
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
}

mat2 rot(float a) {
  float c = cos(a), s = sin(a);
  return mat2(c, -s, s, c);
}

// Slow lissajous drift: two incommensurate periods, amplitude in viewport units.
vec2 drift(float t, float p1, float p2, float phase, vec2 amp) {
  return amp * vec2(sin(t * TAU / p1 + phase), cos(t * TAU / p2 - phase * 0.5));
}

// Pointer nudge: at most 1% of the viewport, toward the pointer.
vec2 nudge(vec2 c, vec2 ptr, float on, float aspect) {
  vec2 d = ptr - c;
  float len = max(length(d), 1e-4);
  return on * 0.01 * vec2(aspect, 1.0) * (d / len);
}

float fill(float sd, float px) {
  return 1.0 - smoothstep(-px, px, sd);
}

void main() {
  vec2  res    = u_resolution;
  float aspect = res.x / res.y;
  vec2  uv     = (gl_FragCoord.xy - 0.5 * res) / res.y;
  vec2  ptr    = (vec2(u_pointer.x, res.y - u_pointer.y) - 0.5 * res) / res.y;
  float px     = 1.5 / res.y;
  float t      = u_time;
  vec2  amp    = 0.04 * vec2(aspect, 1.0);

  // Resting positions of the three primitives.
  vec2 cC = vec2(-0.30 * aspect,  0.14) + drift(t, 47.0, 61.0, 0.9, amp);
  vec2 cR = vec2( 0.22 * aspect, -0.10) + drift(t, 53.0, 41.0, 2.1, amp);
  vec2 cB = vec2( 0.00 * aspect,  0.00) + drift(t, 67.0, 44.0, 4.0, amp);

  // Only the shape nearest the pointer responds.
  float dC = distance(ptr, cC), dR = distance(ptr, cR), dB = distance(ptr, cB);
  float nC = step(dC, min(dR, dB));
  float nR = step(dR, min(dC, dB)) * (1.0 - nC);
  float nB = 1.0 - nC - nR;
  cC += nudge(cC, ptr, nC, aspect);
  cR += nudge(cR, ptr, nR, aspect);
  cB += nudge(cB, ptr, nB, aspect);

  // Circle (red), rectangle (blue), long rotated bar (yellow).
  float mC = fill(sdCircle(uv - cC, 0.34), px);
  float mR = fill(sdBox(uv - cR, vec2(0.46, 0.30)), px);
  float mB = fill(sdBox(rot(-0.42 + 0.03 * sin(t * TAU / 70.0)) * (uv - cB), vec2(0.95, 0.075)), px);

  // Multiply blend at 12% opacity; overlaps compound into new hues.
  vec3 col = PAGE;
  col *= mix(vec3(1.0), u_c1, 0.12 * mC);
  col *= mix(vec3(1.0), u_c2, 0.12 * mR);
  col *= mix(vec3(1.0), u_c3, 0.12 * mB);

  gl_FragColor = vec4(col, 1.0);
}
</script>
