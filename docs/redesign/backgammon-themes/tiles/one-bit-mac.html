<section class="theme" id="theme-one-bit-mac" data-theme="one-bit-mac">
<style>
#theme-one-bit-mac {
  --page: #f4f4f0;
  --shader-1: #f4f4f0;
  --shader-2: #111111;
  --shader-3: #111111;
  --surface: #ffffff;
  --surface-2: #ececea;
  --line: #111111;
  --ink: #111111;
  --muted: #4a4a4a;
  --accent: #111111;
  --accent-ink: #ffffff;
  --board-frame: #111111;
  --board-surface: #ffffff;
  --point-a: #d9d9d9;
  --point-b: #7a7a7a;
  --bar: #111111;
  --checker-white: #ffffff;
  --checker-white-edge: #111111;
  --checker-black: #111111;
  --checker-black-edge: #ffffff;
  --dice: #ffffff;
  --pips: #111111;
  --cube: #111111;
  --cube-text: #ffffff;
  --highlight: #111111;
  --last-move: #111111;
  font-family: 'Chicago', 'Charcoal', 'Geneva', ui-sans-serif, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.4;
  letter-spacing: 0;
  color: var(--ink);
  background: var(--page);
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
  padding: 24px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  grid-template-areas: "board chrome" "swatches swatches";
  gap: 24px;
  border: 1px solid var(--line);
}
#theme-one-bit-mac *, #theme-one-bit-mac *::before, #theme-one-bit-mac *::after { box-sizing: border-box; }
#theme-one-bit-mac > .shader {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; z-index: 0; image-rendering: pixelated;
}
#theme-one-bit-mac > :not(.shader) { position: relative; z-index: 1; }
#theme-one-bit-mac .board { grid-area: board; }
#theme-one-bit-mac .board svg {
  display: block; width: 100%; height: auto;
  shape-rendering: crispEdges;
  background: var(--board-surface);
  box-shadow: 2px 2px 0 var(--line);
}
#theme-one-bit-mac .board text { shape-rendering: auto; }
#theme-one-bit-mac .board circle, #theme-one-bit-mac .board .round { shape-rendering: geometricPrecision; }
#theme-one-bit-mac .ants {
  stroke-dasharray: 4 4;
  animation: one-bit-mac-march 1s linear infinite;
}
@keyframes one-bit-mac-march { to { stroke-dashoffset: -8; } }
@media (prefers-reduced-motion: reduce) { #theme-one-bit-mac .ants { animation: none; } }

#theme-one-bit-mac .chrome { grid-area: chrome; display: flex; flex-direction: column; gap: 12px; }
#theme-one-bit-mac h2 {
  margin: 0; font-size: 22px; font-weight: 700; line-height: 1.1;
  -webkit-font-smoothing: none;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
#theme-one-bit-mac h2, #theme-one-bit-mac p {
  background: var(--page); padding-left: 2px; padding-right: 2px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
#theme-one-bit-mac p { margin: 0; color: var(--muted); }
#theme-one-bit-mac .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
#theme-one-bit-mac .btn {
  font: inherit; font-weight: 700; min-height: 44px; min-width: 44px;
  padding: 0 16px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line);
  -webkit-font-smoothing: none;
}
#theme-one-bit-mac .btn.primary { background: var(--accent); color: var(--accent-ink); }
#theme-one-bit-mac .btn.primary:hover { box-shadow: inset 0 0 0 1px var(--accent-ink); }
#theme-one-bit-mac .btn.ghost { background: var(--surface); color: var(--ink); }
#theme-one-bit-mac .btn.ghost:hover { background: var(--ink); color: var(--surface); }
#theme-one-bit-mac .panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 0;
  box-shadow: 2px 2px 0 var(--line); padding: 10px 12px;
  display: grid; grid-template-columns: 1fr auto; row-gap: 6px; column-gap: 12px;
}
#theme-one-bit-mac .panel dt { color: var(--muted); margin: 0; }
#theme-one-bit-mac .panel dd { margin: 0; font-weight: 700; text-align: right; -webkit-font-smoothing: none; }
#theme-one-bit-mac .equity {
  grid-column: 1 / -1; height: 6px; border: 1px solid var(--line);
  background: repeating-conic-gradient(var(--ink) 0 25%, transparent 0 100%) 0 0 / 4px 4px;
  background-color: var(--surface);
}
#theme-one-bit-mac .equity i { display: block; height: 100%; width: 58%; background: var(--ink); }

#theme-one-bit-mac .swatches {
  grid-area: swatches; display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
}
#theme-one-bit-mac .swatches figure {
  margin: 0; border: 1px solid var(--line); background: var(--surface);
  box-shadow: 2px 2px 0 var(--line);
}
#theme-one-bit-mac .swatches i { display: block; height: 36px; border-bottom: 1px solid var(--line); }
#theme-one-bit-mac .swatches figcaption {
  font-size: 12px; padding: 4px 6px; line-height: 1.3;
  font-family: ui-monospace, Menlo, Monaco, monospace;
}
#theme-one-bit-mac .swatches figcaption b { display: block; font-weight: 700; font-family: inherit; }
@media (max-width: 720px) {
  #theme-one-bit-mac { grid-template-columns: 1fr; grid-template-areas: "board" "chrome" "swatches"; padding: 16px; }
}
</style>

<canvas class="shader" width="640" height="360" aria-hidden="true" data-pointer-origin="top-left" data-pointer-idle="center" data-still="0"></canvas>
<script type="x-shader/x-fragment" id="frag-one-bit-mac">
precision mediump float;

uniform float u_time;
uniform vec2  u_resolution;
uniform vec2  u_pointer;
uniform vec3  u_c1; // paper  #f4f4f0
uniform vec3  u_c2; // ink    #111111
uniform vec3  u_c3; // unused here: binary output only

// 2x2 Bayer cell: [[0,2],[3,1]] expressed without arrays.
float bayer2(vec2 p) {
  float x = mod(p.x, 2.0);
  float y = mod(p.y, 2.0);
  float x_xor_y = mod(x + y, 2.0);
  return 2.0 * x_xor_y + y;
}

// 4x4 Bayer threshold via the recursive bit-interleave form:
// M4(x,y) = 4 * M2(x mod 2, y mod 2) + M2(x / 2, y / 2). Returns 0..15.
float bayer4(vec2 p) {
  vec2 lo = mod(p, 2.0);
  vec2 hi = floor(mod(p, 4.0) / 2.0);
  return 4.0 * bayer2(lo) + bayer2(hi);
}

// One drifting blob: 0..1, soft ring falloff from its centre.
float blob(vec2 uv, vec2 c, float k, float t) {
  float d = distance(uv, c);
  return 0.5 + 0.5 * sin(d * k - t * 0.3);
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 uv = frag / u_resolution;
  float aspect = u_resolution.x / max(u_resolution.y, 1.0);
  vec2 q = vec2(uv.x * aspect, uv.y);

  // Teletext-style page refresh: time advances in discrete steps so the
  // field redraws in frames rather than shimmering per refresh.
  float t = floor(u_time * 4.0) / 4.0;

  // Three slow lava-lamp blobs.
  vec2 c1 = vec2(0.5 * aspect + 0.35 * aspect * sin(t * 0.11), 0.55 + 0.30 * cos(t * 0.07));
  vec2 c2 = vec2(0.5 * aspect + 0.40 * aspect * cos(t * 0.05), 0.40 + 0.35 * sin(t * 0.09));
  vec2 c3 = vec2(0.5 * aspect + 0.30 * aspect * sin(t * 0.08 + 2.0), 0.60 + 0.25 * cos(t * 0.13 + 1.0));
  float v = blob(q, c1, 7.0, t) + blob(q, c2, 9.0, t * 1.3) + blob(q, c3, 5.0, t * 0.7);
  v /= 3.0;

  // Vertical gradient: lighter at the top.
  v = v * 0.6 + 0.4 * uv.y;

  // Keep the board's centre near-pure paper; let ink gather at the edges.
  vec2 fromCentre = (uv - 0.5) * vec2(aspect, 1.0);
  float edge = smoothstep(0.25, 0.75, length(fromCentre));

  // Compress into a narrow band so coverage stays ~0-10%.
  float field = mix(0.98, 0.78, v * edge);
  field = clamp(field + 0.10 * (1.0 - edge), 0.0, 1.0);

  // Pointer pulls ink: a 90px circle lowers the field toward ~30% coverage.
  vec2 pointerPx = vec2(u_pointer.x, u_resolution.y - u_pointer.y);
  float pull = 1.0 - smoothstep(60.0, 90.0, distance(frag, pointerPx));
  field -= 0.28 * pull;

  // Ordered dither: 1-bit output only.
  float threshold = (bayer4(floor(frag)) + 0.5) / 16.0;
  float ink = step(field, threshold);

  vec3 col = mix(u_c1, u_c2, ink);
  gl_FragColor = vec4(col, 1.0);
}
</script>
