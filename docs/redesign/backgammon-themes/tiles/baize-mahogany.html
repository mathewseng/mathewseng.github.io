<section class="theme" id="theme-baize-mahogany" data-theme="baize-mahogany">
  <style>
    #theme-baize-mahogany {
      --page: #0e2a1f;
      --surface: #153626;
      --surface-2: #1b4230;
      --line: #2a5440;
      --ink: #eef3e9;
      --muted: #a9c4b2;
      --accent: #b3382f;
      --accent-ink: #fff6ee;
      --board-frame: #4b1d12;
      --board-surface: #14402b;
      --point-a: #b89560;
      --point-b: #b23a2e;
      --bar: #3a1710;
      --checker-white: #f8f3e6;
      --checker-white-edge: #d6ccb3;
      --checker-black: #121110;
      --checker-black-edge: #3a3634;
      --dice: #c8262a;
      --pips: #ffffff;
      --cube: #f5efe0;
      --cube-text: #1a1a1a;
      --highlight: #a6f2c9;
      --last-move: #bfe3ff;
      --shader-1: #0a2017;
      --shader-2: #1a4a33;
      --shader-3: #081a13;
      font-family: Futura, "Avenir Next", Avenir, "Century Gothic", "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums lining-nums;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 14px;
      background: var(--page);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 400;
    }
    #theme-baize-mahogany *, #theme-baize-mahogany *::before, #theme-baize-mahogany *::after { box-sizing: inherit; }
    #theme-baize-mahogany .shader {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; z-index: 0; pointer-events: none;
    }
    #theme-baize-mahogany .tile {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 24px; align-items: start;
    }
    #theme-baize-mahogany .board {
      width: 100%; height: auto; display: block;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 20px 40px rgba(0,0,0,0.35);
      font-family: inherit;
    }
    #theme-baize-mahogany h2 {
      margin: 0 0 8px; font-size: 24px; font-weight: 500; letter-spacing: 0.01em; line-height: 1.2;
    }
    #theme-baize-mahogany p { margin: 0 0 16px; color: var(--muted); }
    #theme-baize-mahogany .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    #theme-baize-mahogany button {
      font: inherit; font-weight: 500; letter-spacing: 0.01em;
      min-height: 44px; padding: 0 22px; border-radius: 999px; cursor: pointer;
      border: 1px solid transparent; background: transparent; color: var(--ink);
    }
    #theme-baize-mahogany .primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
    #theme-baize-mahogany .ghost { border-color: rgba(169,196,178,0.6); }
    #theme-baize-mahogany .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    #theme-baize-mahogany .panel dl { margin: 0; }
    #theme-baize-mahogany .panel dt { font-size: 12px; color: var(--muted); margin: 0 0 2px; }
    #theme-baize-mahogany .panel dd { margin: 0; font-size: 22px; font-weight: 500; }
    #theme-baize-mahogany .swatches {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 24px;
    }
    #theme-baize-mahogany .swatches div {
      height: 44px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: flex-end; padding: 6px 8px; font-size: 12px;
    }
    @media (max-width: 720px) {
      #theme-baize-mahogany { padding: 16px; }
      #theme-baize-mahogany .tile { grid-template-columns: 1fr; }
      #theme-baize-mahogany .swatches { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
  <canvas class="shader" width="640" height="360" aria-hidden="true" data-pointer-origin="top-left" data-pointer-idle="center" data-still="0"></canvas>
  <script type="x-shader/x-fragment" id="frag-baize-mahogany">
precision mediump float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_pointer;
uniform vec3 u_c1; /* felt in shadow */
uniform vec3 u_c2; /* felt under the lamp */
uniform vec3 u_c3; /* corner vignette */

/* --- helpers: value noise, 2-octave fbm --- */
float hash(vec2 p) {
  p = fract(p * vec2(127.1, 311.7));
  p += dot(p, p + 19.19);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm2(vec2 p) {
  float v = 0.0;
  float amp = 0.5;
  for (int i = 0; i < 2; i++) {
    v += amp * noise(p);
    p = p * 2.1 + vec2(1.7, 9.2);
    amp *= 0.5;
  }
  return v;
}

void main() {
  /* top-down uv so the lamp hangs above centre */
  vec2 uv = gl_FragCoord.xy / u_resolution;
  uv.y = 1.0 - uv.y;
  float aspect = u_resolution.x / u_resolution.y;

  /* lamp centre, nudged 0.02 toward the pointer */
  vec2 ptr = clamp(u_pointer / u_resolution, 0.0, 1.0);
  vec2 c = vec2(0.5, 0.35) + (ptr - vec2(0.5, 0.35)) * 0.02;

  /* soft cone of tungsten light */
  vec2 d = (uv - c) * vec2(aspect, 1.25);
  float l = smoothstep(1.1, 0.0, length(d));
  l *= 1.0 + 0.03 * sin(u_time * 0.6);
  vec3 col = mix(u_c1, u_c2, l);

  /* felt nap: static, high-frequency, barely there */
  float n = noise(uv * vec2(aspect, 1.0) * 420.0);
  col += (n - 0.5) * 0.06;

  /* smoke: two fbm layers drifting upward, only visible where lit */
  vec2 sp = uv * vec2(aspect, 1.0);
  float s1 = fbm2(sp * 3.0 + vec2(0.0, u_time * 0.02));
  float s2 = fbm2(sp * 5.5 + vec2(1.3, u_time * 0.03) + s1 * 0.8);
  float smoke = smoothstep(0.30, 0.78, s1 * 0.6 + s2 * 0.4);
  col += vec3(0.78, 0.74, 0.68) * smoke * 0.035 * l;

  /* vignette to the corners */
  float v = smoothstep(1.35, 0.5, length((uv - 0.5) * vec2(aspect, 1.0)));
  col = mix(u_c3, col, v);

  gl_FragColor = vec4(col, 1.0);
}
  </script>
