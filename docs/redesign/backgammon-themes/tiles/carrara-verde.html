<section class="theme" id="theme-carrara-verde" data-theme="carrara-verde">
<style>
#theme-carrara-verde {
  --page: #ece9e3;
  --shader-1: #f1eee8;
  --shader-2: #e4e0d8;
  --shader-3: #4b7a67;
  --surface: #f7f5f1;
  --surface-2: #e4e0d8;
  --line: #cfc9bf;
  --edge: #d8d3ca;
  --ink: #1d1f24;
  --muted: #5a5e66;
  --accent: #2f5a4a;
  --accent-ink: #f3f6f2;
  --danger: #8c2f2a;
  --board-frame: #b7b1a7;
  --board-surface: #efece6;
  --point-a: #8d8f93;
  --point-b: #2f5a4a;
  --bar: #3a3c40;
  --checker-white: #fbfaf6;
  --checker-white-edge: #d2cdc2;
  --checker-black: #15171c;
  --checker-black-edge: #3b3e46;
  --dice: #15171c;
  --pips: #f7f5f1;
  --cube: #c9a24d;
  --cube-edge: #8c6f2c;
  --cube-text: #1d1f24;
  --highlight: #c25a12;
  --last-move: #b0392f;
  font-family: Optima, "Gill Sans", "Gill Sans Nova", Candara, "Trebuchet MS", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: 0;
  color: var(--ink);
  background: var(--page);
  position: relative;
  overflow: hidden;
  padding: 24px;
  border-radius: 4px;
  box-sizing: border-box;
}
#theme-carrara-verde *, #theme-carrara-verde *::before, #theme-carrara-verde *::after { box-sizing: border-box; }
#theme-carrara-verde .shader {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; z-index: 0; pointer-events: none;
}
#theme-carrara-verde .tile {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(220px, 1fr);
  gap: 24px;
  align-items: start;
}
#theme-carrara-verde .board { width: 100%; height: auto; display: block; }
#theme-carrara-verde h2 {
  margin: 0 0 12px; font-weight: 500; font-size: 28px; line-height: 1.15; letter-spacing: 0;
}
#theme-carrara-verde p { margin: 0 0 20px; color: var(--ink); max-width: 36ch; }
#theme-carrara-verde .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
#theme-carrara-verde .btn {
  font: inherit; font-weight: 500; min-height: 44px; min-width: 44px; padding: 0 18px;
  border-radius: 4px; border: 1px solid transparent; cursor: pointer; box-shadow: none;
}
#theme-carrara-verde .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#theme-carrara-verde .btn-ghost { background: transparent; color: var(--ink); border-color: var(--point-a); }
#theme-carrara-verde .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
#theme-carrara-verde .panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom: 2px solid var(--edge);
  border-radius: 4px;
  padding: 14px 16px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
#theme-carrara-verde .panel dl { margin: 0; }
#theme-carrara-verde .panel dt { color: var(--muted); font-size: 13px; margin-bottom: 2px; }
#theme-carrara-verde .panel dd { margin: 0; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums lining-nums; }
#theme-carrara-verde .swatches {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px;
  margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line);
}
#theme-carrara-verde .swatch { display: grid; gap: 4px; }
#theme-carrara-verde .swatch i { display: block; height: 32px; border-radius: 4px; border: 1px solid var(--line); }
#theme-carrara-verde .swatch span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#theme-carrara-verde .swatch b { font-weight: 500; color: var(--ink); font-size: 12px; display: block; }
#theme-carrara-verde .board text { font-family: inherit; }
@media (max-width: 720px) {
  #theme-carrara-verde .tile { grid-template-columns: 1fr; }
}
</style>

<canvas class="shader" width="640" height="360" aria-hidden="true" data-pointer-origin="bottom-left" data-pointer-idle="center" data-still="0"></canvas>
<script type="x-shader/x-fragment" id="frag-carrara-verde">
precision mediump float;

uniform float u_time;        // seconds
uniform vec2  u_resolution;  // px
uniform vec2  u_pointer;     // px, bottom-left origin, already lerped at 20% by the host
uniform vec3  u_c1;          // light carrara  #f1eee8
uniform vec3  u_c2;          // shaded carrara #e4e0d8
uniform vec3  u_c3;          // verde alpi      #4b7a67

// --- textbook value noise -------------------------------------------------
float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

// 3-octave fbm, enough for cloudy stone
float fbm(vec2 p) {
  float v = 0.0;
  float amp = 0.5;
  for (int i = 0; i < 3; i++) {
    v += amp * vnoise(p);
    p = p * 2.03 + vec2(1.7, 9.2);
    amp *= 0.5;
  }
  return v;
}

float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution;
  float aspect = u_resolution.x / u_resolution.y;

  // --- marble: domain-warped fbm, folded into thin veins -----------------
  vec2 p = uv * vec2(aspect, 1.0) * 1.6;
  vec2 q = p + 0.4 * vec2(fbm(p + 1.7), fbm(p + 9.2));
  float v = fbm(q * 2.0 + vec2(0.0, u_time * 0.004));
  float veins = pow(1.0 - abs(sin(v * 6.28318 * 1.5)), 10.0);

  // cloudy tonal variation of the honed slab
  vec3 base = mix(u_c1, u_c2, fbm(p * 0.7));

  // grey bardiglio veins
  vec3 greyVein = vec3(0.655, 0.667, 0.682); // #a7aaae
  vec3 col = mix(base, greyVein, veins * 0.55);

  // a few veins carry a verde tint
  float verdeMask = smoothstep(0.58, 0.68, fbm(q * 0.5));
  col = mix(col, u_c3, veins * verdeMask * 0.25);

  // --- daylight from a tall window, top-left ----------------------------
  float sway = sin(u_time * 0.05) * 0.00524; // 0.3 degrees in radians
  vec2 dir = normalize(vec2(-1.0 + sway, 1.0 + sway));
  vec2 c = (uv - 0.5) * vec2(aspect, 1.0);
  float reach = 0.5 * length(vec2(aspect, 1.0));
  float light = clamp(dot(c, dir) / reach, 0.0, 1.0) * 0.03;
  col += light;

  // --- pointer: polished stone catching the light -----------------------
  float d = distance(gl_FragCoord.xy, u_pointer);
  float spec = smoothstep(150.0, 0.0, d);
  spec = spec * spec * 0.06;
  col += spec;

  // --- legibility floor: keep luminance >= 0.86 for the ink above ------
  float l = luma(col);
  col += max(0.0, 0.86 - l);
  col = min(col, vec3(1.0));

  gl_FragColor = vec4(col, 1.0);
}
</script>
