<!doctype html>
<html lang="en" data-family="cards">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <meta name="description" content="Card Table Workshop: a sandbox card table for prototyping card games, with groups, macros, scoring badges, players, chips and online rooms." />
    <title>Card Table Workshop</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="../shared/tokens.css?v=20261016" />
    <link rel="stylesheet" href="../shared/app.css?v=20261016" />
    <link rel="stylesheet" href="../shared/cards.css?v=20261016" />
    <link rel="stylesheet" href="./styles.css?v=20261021-less" />
    <script>document.documentElement.classList.add("is-ready");</script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the table</a>
    <div class="app-shell" id="app">
      <header class="topbar">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="/"><span class="mark" aria-hidden="true">MS</span><span class="sr-only">Projects</span></a>
          <span class="crumb-sep" aria-hidden="true">/</span>
          <span class="crumb-current" aria-current="page">Card Table Workshop</span>
        </nav>
        <nav class="tool-nav" aria-label="Card Table Workshop tools">
          <a href="/cards/" aria-current="page">Card Table Workshop</a>
        </nav>
        <div class="topbar-actions top-actions">
          <button class="btn btn--sm btn--icon" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-undo" /></svg>
          </button>
          <button class="btn btn--sm btn--icon" id="redoBtn" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
            <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-redo" /></svg>
          </button>
          <div class="field field--select view-field">
            <label for="viewSelect" class="sr-only">View as</label>
            <select id="viewSelect" class="view-select" title="Whose eyes are you looking through?"></select>
          </div>
          <button class="btn btn--sm btn--icon" id="reactBtn" type="button" title="React" aria-label="React" aria-haspopup="menu" hidden>
            <svg class="icon" aria-hidden="true" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" /><path d="M6.8 11.5a3.6 3.6 0 0 0 6.4 0" /><circle cx="7.5" cy="8" r=".7" fill="currentColor" stroke="none" /><circle cx="12.5" cy="8" r=".7" fill="currentColor" stroke="none" /></svg>
          </button>
          <button class="btn btn--sm btn--icon" id="logBtn" type="button" title="Table chat and log" aria-label="Table chat and log" aria-haspopup="dialog" hidden>
            <svg class="icon" aria-hidden="true" viewBox="0 0 20 20"><path d="M3.5 5.5A1.5 1.5 0 0 1 5 4h10a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 15 14H8l-3.5 3v-3H5a1.5 1.5 0 0 1-1.5-1.5z" /><path d="M7 8h6M7 10.5h4" /></svg>
          </button>
          <button class="btn btn--sm room-btn" id="roomBtn" type="button" title="Play online with friends" aria-haspopup="dialog">
            <span class="badge badge--plain room-badge" id="roomLabel" data-state="local">Online</span>
          </button>
          <button class="btn btn--sm btn--primary" id="newBtn" type="button" title="Start a new game (N)" aria-haspopup="dialog">
            <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-plus" /></svg>
            <span class="lbl">New game</span>
          </button>
          <button class="btn btn--sm btn--icon" id="menuBtn" type="button" title="More" aria-label="More" aria-haspopup="menu">
            <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-more" /></svg>
          </button>
          <button class="btn btn--sm btn--icon" id="sideToggle" type="button" title="Toggle panel (\)" aria-label="Toggle side panel" aria-pressed="true">
            <svg class="icon" aria-hidden="true" viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="1.5" /><path d="M12.5 4v12" /></svg>
          </button>
        </div>
      </header>

      <div class="tool-head table-head">
        <div class="title-block">
          <label for="titleInput" class="sr-only">Table name</label>
          <input id="titleInput" class="title-input" type="text" maxlength="48" />
        </div>
        <div class="turn-strip" id="turnStrip"></div>
      </div>

      <main class="workspace" id="main" tabindex="-1">
        <section class="table" id="table" aria-label="Card table">
          <div class="game-over" id="gameOver" role="region" aria-label="Game over" hidden></div>
          <div class="offers" id="offers" hidden></div>
          <div id="around" hidden></div>
          <section class="table-section">
            <div class="area-label">
              <span>Table</span>
              <button class="btn btn--sm btn--ghost" type="button" data-add-zone="table" title="Add a shared group to the table">+ Group</button>
            </div>
            <div class="table-zones" id="tableZones"></div>
          </section>
          <section class="table-section">
            <div class="area-label">
              <span>Seats</span>
              <button class="btn btn--sm btn--ghost" type="button" id="addSeatBtn">+ Player</button>
              <button class="btn btn--sm btn--ghost" type="button" data-add-zone="seats" title="Add a group to every seat">+ Group per seat</button>
            </div>
            <div class="seats" id="seats"></div>
          </section>
        </section>

        <aside class="side" id="side" aria-label="Controls">
          <div class="side-head">
            <button class="sheet-handle" type="button" aria-label="Close the panel"></button>
            <nav class="tabs side-tabs" id="tabs" role="tablist" aria-label="Panel">
              <button type="button" role="tab" data-tab="play" class="on" aria-selected="true" aria-controls="pane" id="tab-play">
                <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-play" /></svg><span>Play</span>
              </button>
              <button type="button" role="tab" data-tab="deck" aria-selected="false" aria-controls="pane" id="tab-deck" tabindex="-1">
                <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-cards" /></svg><span>Deck</span>
              </button>
              <button type="button" role="tab" data-tab="seats" aria-selected="false" aria-controls="pane" id="tab-seats" tabindex="-1">
                <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-users" /></svg><span>Players</span>
              </button>
              <button type="button" role="tab" data-tab="scores" aria-selected="false" aria-controls="pane" id="tab-scores" tabindex="-1">
                <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-flag" /></svg><span>Scores</span>
              </button>
              <button type="button" role="tab" data-tab="rules" aria-selected="false" aria-controls="pane" id="tab-rules" tabindex="-1">
                <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-rules" /></svg><span>Rules</span>
              </button>
            </nav>
          </div>
          <div class="pane" id="pane" role="tabpanel" aria-labelledby="tab-play"></div>
        </aside>
      </main>

      <div class="ct-stage" id="stage" hidden>
        <div class="selection-bar" id="selectionBar" role="toolbar" aria-label="Selected cards" hidden></div>
        <div class="replay-bar" id="replayBar" role="toolbar" aria-label="Replay" hidden></div>
        <div class="dock" id="dock" role="toolbar" aria-label="Quick actions" hidden></div>
      </div>
    </div>

    <div class="tour" id="tour" hidden><div class="tour-spot"></div><div class="tour-bubble" role="dialog" aria-label="Tour"></div></div>
    <div class="toast-stack toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="toast-stack toasts toasts--alert" id="alerts" role="alert" aria-live="assertive"></div>

    <div class="pass-screen" id="passScreen" hidden>
      <div>
        <p>Pass the device to</p>
        <h2 id="passName">Player</h2>
        <p class="small">Other hands stay hidden until you tap.</p>
        <button class="btn btn--primary btn--lg pass-ready" id="passReady" type="button">I'm ready, show my cards</button>
      </div>
    </div>

    <dialog id="dialog" class="dialog dialog--sheet"></dialog>
    <dialog id="paneDialog" class="dialog dialog--sheet dialog--wide" aria-labelledby="paneDialogTitle">
      <div class="dialog-head">
        <h2 id="paneDialogTitle">Log</h2>
        <button class="btn btn--ghost btn--icon" type="button" id="paneDialogClose" aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="../shared/icons.svg#i-close" /></svg>
        </button>
      </div>
      <div class="dialog-body pane pane--dialog" id="paneDialogBody"></div>
    </dialog>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../shared/peer-room.js?v=20261016"></script>
    <script src="../shared/cards.js?v=20261016"></script>
    <script src="../shared/sheet.js?v=20261016"></script>
    <script src="./evaluators.js?v=20261016"></script>
    <script src="./engine.js?v=20261016"></script>
    <script src="./presets.js?v=20261016"></script>
    <script src="./app.js?v=20261021-less"></script>
  </body>
</html>
