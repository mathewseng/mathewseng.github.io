<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <meta name="description" content="Card Table Workshop: a sandbox card table for prototyping card games, with groups, macros, scoring badges, players, chips and online rooms." />
    <title>Card Table Workshop</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=20260926k" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="/" title="mathewseng.github.io">MS</a>
        <div class="title-block">
          <input id="titleInput" class="title-input" type="text" aria-label="Table name" maxlength="48" />
        </div>
        <div class="turn-strip" id="turnStrip" aria-live="polite"></div>
        <div class="top-actions">
          <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
          </button>
          <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
          </button>
          <select id="viewSelect" class="view-select" aria-label="View as" title="Whose eyes are you looking through?"></select>
          <button class="btn icon" id="reactBtn" title="React" aria-label="React" hidden>😀</button>
          <button class="btn" id="roomBtn" title="Play online with friends">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2c3 .1 5 2.6 5 5.8"/></svg>
            <span class="lbl" id="roomLabel">Online</span>
          </button>
          <button class="btn primary" id="newBtn" title="Start a new game (N)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span class="lbl">New game</span>
          </button>
          <button class="btn icon" id="menuBtn" title="More" aria-label="More">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
          <button class="btn icon" id="sideToggle" title="Toggle panel (\)" aria-label="Toggle side panel">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <main class="table" id="table" aria-label="Card table">
          <div class="game-over" id="gameOver" hidden></div>
          <div id="around" hidden></div>
          <section class="table-section">
            <div class="area-label">
              <span>Table</span>
              <button class="btn sm ghost" data-add-zone="table" title="Add a shared group to the table">+ Group</button>
            </div>
            <div class="table-zones" id="tableZones"></div>
          </section>
          <section class="table-section">
            <div class="area-label">
              <span>Seats</span>
              <button class="btn sm ghost" id="addSeatBtn">+ Player</button>
              <button class="btn sm ghost" data-add-zone="seats" title="Add a group to every seat">+ Group per seat</button>
            </div>
            <div class="seats" id="seats"></div>
          </section>
        </main>

        <aside class="side" id="side" aria-label="Controls">
          <div>
            <div class="sheet-handle"></div>
            <nav class="tabs" id="tabs" role="tablist">
              <button data-tab="play" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16l13-8z"/></svg>Play</button>
              <button data-tab="scores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Scores</button>
              <button data-tab="seats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><path d="M17 8v6M14 11h6"/></svg>Players</button>
              <button data-tab="deck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="3" width="13" height="17" rx="2"/><path d="M4 6v13a2 2 0 0 0 2 2h10"/></svg>Deck</button>
              <button data-tab="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Tools</button>
              <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Log</button>
              <button data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5z"/><path d="M9 11h6M9 15h6"/></svg>Rules</button>
            </nav>
          </div>
          <div class="pane" id="pane"></div>
        </aside>
      </div>
    </div>

    <div class="selection-bar" id="selectionBar" hidden></div>
    <div class="replay-bar" id="replayBar" hidden></div>
    <div class="toasts" id="toasts"></div>

    <div class="pass-screen" id="passScreen" hidden>
      <div>
        <p>Pass the device to</p>
        <h2 id="passName">Player</h2>
        <p class="small">Other hands stay hidden until you tap.</p>
        <button class="btn primary" id="passReady" style="margin-top: 14px; min-height: 44px; padding: 0 24px">I'm ready — show my cards</button>
      </div>
    </div>

    <dialog id="dialog"></dialog>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="../shared/peer-room.js?v=20260908a"></script>
    <script src="./evaluators.js?v=20260926k"></script>
    <script src="./engine.js?v=20260926k"></script>
    <script src="./presets.js?v=20260926k"></script>
    <script src="./app.js?v=20260926k"></script>
  </body>
</html>
