[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jazz-piano-ml"
version = "0.1.0"
description = "End-to-end MVP pipeline for jazz piano transcription and symbolic generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pretty_midi>=0.2.10",
  "mido>=1.3.2",
  "torch>=2.2",
]

[project.optional-dependencies]
transcription = [
  "basic-pitch>=0.4.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
jazz-piano-ml = "jazz_piano_ml.cli:main"

[tool.setuptools]
packages = ["jazz_piano_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
