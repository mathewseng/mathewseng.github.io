name: Validate site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    # Playwright 1.58.2 supports 24.04; keep browser dependencies off OS rollovers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Refresh project directory and history dates
        run: node scripts/build-project-directory.mjs

      - name: Version Backgammon offline assets
        run: node backgammon/scripts/offline-manifest.mjs

      - name: Test site pages
        run: node scripts/run-tests.mjs

      - name: Assemble site for browser tests
        run: sh scripts/assemble-site.sh _site

      - name: Use Ubuntu primary package mirror
        # The runner's Azure mirror can throttle browser dependency downloads.
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi

      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Sweep every assembled page for shell regressions
        run: node scripts/shell-browser.cjs

      - name: Test project directory search and navigation
        run: node scripts/project-directory-browser.cjs

      - name: Test assembled Dice reports
        run: node dice/reports/tests/browser.cjs

      - name: Test assembled Draw Dice game
        run: |
          node dice/draw/tests/browser.cjs
          node dice/draw/tests/responsive.cjs
          node dice/draw/tests/rules-browser.cjs
          node dice/draw/tests/advice-browser.cjs

      - name: Test assembled Scoundrel game and reports
        run: |
          node scoundrel/tests/browser.cjs
          node scoundrel/tests/deck-overview.cjs
          node scoundrel/tests/responsive.cjs

      - name: Test assembled Backgammon application
        run: node backgammon/tests/browser.cjs

      - name: Test Backgammon opening book against live GNUbg
        env:
          BG_BROWSERS: chromium
        run: node backgammon/tests/opening-book-browser.cjs

  gym:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
