name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner label for manual publishing when hosted runners are busy
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: gym/package-lock.json

      - name: Install dependencies
        working-directory: gym
        run: npm ci

      - name: Build gym app
        working-directory: gym
        # Validation runs independently; only compilation is needed to publish.
        run: npx --no-install vite build

      - name: Refresh project directory and history dates
        run: node scripts/build-project-directory.mjs

      - name: Version Backgammon offline assets
        run: node backgammon/scripts/offline-manifest.mjs

      - name: Assemble complete user site
        run: sh scripts/assemble-site.sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_label || 'ubuntu-latest' }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
