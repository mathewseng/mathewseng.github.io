<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070b" />
    <title>Mathew Seng Projects</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070b;
        --surface: #0b1118;
        --surface-2: #101923;
        --line: rgba(193, 207, 224, 0.14);
        --text: #eef5ff;
        --muted: #93a3b8;
        --accent: #37d99e;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 42px 0;
      }

      header {
        margin-bottom: 22px;
      }

      p,
      h1,
      h2 {
        margin: 0;
      }

      .eyebrow {
        margin-bottom: 8px;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 850;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      a.card {
        min-height: 132px;
        display: grid;
        align-content: space-between;
        gap: 18px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: inherit;
        text-decoration: none;
      }

      a.card:hover,
      a.card:focus-visible {
        border-color: rgba(55, 217, 158, 0.55);
        background: var(--surface-2);
        outline: none;
      }

      h2 {
        font-size: 1.08rem;
      }

      .card p {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Mathew Seng</p>
        <h1>Projects</h1>
      </header>

      <section class="grid" aria-label="Project directory">
        <a class="card" href="/ofc/">
          <h2>Open-face Chinese Poker</h2>
          <p>Fantasyland trainer, solver tools, and EV matrix.</p>
        </a>
        <a class="card" href="/blackjack-strategy/">
          <h2>Blackjack Strategy</h2>
          <p>Strategy reference and practice tools.</p>
        </a>
        <a class="card" href="/poker-rush/">
          <h2>Poker Rush</h2>
          <p>Fast poker hand reading game.</p>
        </a>
        <a class="card" href="/edge-the-dealer/">
          <h2>Edge the Dealer</h2>
          <p>Table-game experiment and prototype.</p>
        </a>
        <a class="card" href="/ultimate-omaha/">
          <h2>Ultimate Omaha</h2>
          <p>Omaha game prototype.</p>
        </a>
      </section>
    </main>
  </body>
</html>
