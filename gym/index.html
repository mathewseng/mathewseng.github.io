      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='34' width='14' height='32' rx='4' fill='%238ab4ff'/%3E%3Crect x='80' y='34' width='14' height='32' rx='4' fill='%238ab4ff'/%3E%3Crect x='20' y='26' width='12' height='48' rx='4' fill='%238ab4ff'/%3E%3Crect x='68' y='26' width='12' height='48' rx='4' fill='%238ab4ff'/%3E%3Crect x='32' y='44' width='36' height='12' rx='3' fill='%238ab4ff'/%3E%3C/svg%3E"
    />
    <title>Gym Tracker — Training Dashboard</title>
    <script>
      // Pre-paint theme: localStorage["gym-theme"], else the OS preference.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("gym-theme");
        } catch (error) {
          saved = null;
        }
        var dark = saved
          ? saved === "dark"
          : !window.matchMedia("(prefers-color-scheme: light)").matches;
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.classList.add("is-ready");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#08090d" : "#f4f6fa");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
