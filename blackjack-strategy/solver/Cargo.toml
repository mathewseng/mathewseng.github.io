[package]
name = "blackjack_solver"
version = "0.1.0"
edition = "2021"
description = "Rules-aware blackjack basic strategy and Hi-Lo index solver for the static /blackjack-strategy app."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "blackjack_solver_cli"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
